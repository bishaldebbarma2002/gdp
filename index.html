<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Locator | Tripura Transit</title>
    <!-- Font & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #2563eb;
            --accent: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --dark: #0f172a;
            --glass: rgba(255, 255, 255, 0.95);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--dark);
        }

        .locator-card {
            background: var(--glass);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 90%;
            max-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .icon-circle {
            width: 80px;
            height: 80px;
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            font-size: 2rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.4); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(37, 99, 235, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
        }

        h1 { font-weight: 800; font-size: 1.6rem; margin: 0; letter-spacing: -0.5px; }
        p#status { color: #64748b; margin: 10px 0 30px; font-size: 0.95rem; }

        .btn-locate {
            background: var(--dark);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 1rem;
            width: 100%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-locate:hover {
            background: var(--primary);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
        }

        .result-panel {
            margin-top: 30px;
            background: #f1f5f9;
            border-radius: 18px;
            padding: 20px;
            display: none; /* Hidden initially */
            border: 1px solid #e2e8f0;
            text-align: left;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #cbd5e1;
        }

        .data-row:last-child { border: none; margin: 0; padding: 0; }

        .label { font-size: 0.75rem; color: #64748b; font-weight: 600; text-transform: uppercase; }
        .val { font-family: 'Monaco', monospace; font-weight: 700; color: var(--dark); }

        .map-link {
            display: block;
            margin-top: 15px;
            text-align: center;
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
        }

        .loader-dots { display: none; } /* Add logic for loading state if needed */
    </style>
</head>
<body>

    <div class="locator-card">
        <div class="icon-circle" id="main-icon">
            <i class="fas fa-location-dot"></i>
        </div>
        
        <h1>Tripura Transit</h1>
        <p id="status">Tap below to sync your coordinates.</p>

        <button class="btn-locate" id="locate-btn">
            <i class="fas fa-crosshairs"></i>
            Find My Location
        </button>

        <div id="result" class="result-panel">
            <div class="data-row">
                <span class="label">Latitude</span>
                <span class="val" id="lat">0.0000</span>
            </div>
            <div class="data-row">
                <span class="label">Longitude</span>
                <span class="val" id="lon">0.0000</span>
            </div>
            <div class="data-row">
                <span class="label">Accuracy</span>
                <span class="val" id="acc">0m</span>
            </div>
            
            <a id="map-url" href="#" target="_blank" class="map-link">
                <i class="fas fa-map-marked-alt"></i> View on Google Maps
            </a>
        </div>
    </div>

    <script>
        const locateBtn = document.getElementById('locate-btn');
        const statusText = document.getElementById('status');
        const resultPanel = document.getElementById('result');
        const iconCircle = document.getElementById('main-icon');

        locateBtn.addEventListener('click', () => {
            if (!navigator.geolocation) {
                updateStatus("Unsupported Browser", "#ef4444");
                return;
            }

            updateStatus("Accessing Satellite...", "#2563eb");
            locateBtn.disabled = true;
            locateBtn.style.opacity = "0.7";

            const options = {
                enableHighAccuracy: true,
                timeout: 8000,
                maximumAge: 0
            };

            navigator.geolocation.getCurrentPosition(onSuccess, onError, options);
        });

        function onSuccess(pos) {
            const { latitude, longitude, accuracy } = pos.coords;
            
            // Update Text & UI
            updateStatus("Position Verified", "#10b981");
            iconCircle.style.background = "rgba(16, 185, 129, 0.1)";
            iconCircle.style.color = "#10b981";
            iconCircle.style.animation = "none";
            
            resultPanel.style.display = "block";
            document.getElementById('lat').textContent = latitude.toFixed(5);
            document.getElementById('lon').textContent = longitude.toFixed(5);
            document.getElementById('acc').textContent = Math.round(accuracy) + "m";
            
            // Create Map Link
            document.getElementById('map-url').href = `https://www.google.com/maps?q=${latitude},${longitude}`;
            
            locateBtn.disabled = false;
            locateBtn.style.opacity = "1";
            locateBtn.innerHTML = `<i class="fas fa-sync"></i> Update Location`;
        }

        function onError(err) {
            locateBtn.disabled = false;
            locateBtn.style.opacity = "1";
            let msg = "Unknown Error";
            
            if(err.code === 1) msg = "Permission Denied";
            if(err.code === 2) msg = "Signal Lost";
            if(err.code === 3) msg = "Request Timed Out";
            
            updateStatus(msg, "#ef4444");
        }

        function updateStatus(text, color) {
            statusText.textContent = text;
            statusText.style.color = color;
        }
    </script>
</body>
</html>
